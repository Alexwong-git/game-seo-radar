services:
  radar:
    build: .
    container_name: game-seo-radar
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      PORT: ${PORT:-3002}
      HOST: ${HOST:-0.0.0.0}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/radar.sqlite}
    ports:
      - "3002:3002"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    command: sh -c "mkdir -p /app/logs && npm run start 2>&1 | tee -a /app/logs/web.log"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3002)).then((r) => process.exit([200, 401].includes(r.status) ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
